name: Build and Deploy

on:
  push:
    branches: [master, ignite]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pull-request game
        uses: actions/checkout@v4
        with:
          repository: johnyorke/pull-request
          path: pull-request-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pull-request-src/package-lock.json

      - name: Build pull-request game
        run: |
          cd pull-request-src
          npm ci
          npm run build
          rm -rf ../assets/games/pull-request
          mkdir -p ../assets/games/pull-request
          cp -R dist/. ../assets/games/pull-request/

      - name: Install Ignite
        run: |
          git clone https://github.com/twostraws/Ignite.git /tmp/Ignite
          cd /tmp/Ignite && make && sudo make install

      - name: Build site
        run: ignite build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Build
